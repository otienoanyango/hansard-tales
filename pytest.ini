[pytest]
# Pytest configuration for Hansard Tales

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=hansard_tales
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=90

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    property: Property-based tests
    slow: Slow running tests
    sentry_isolated: Sentry tests that need to run in isolation due to logging capture issues

# Coverage options
[coverage:run]
source = hansard_tales
omit =
    */tests/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
